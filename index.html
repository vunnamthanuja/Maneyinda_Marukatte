<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Maneyinda Marukatte - Hyperlocal Women Entrepreneurs Marketplace</title>
  <link rel="icon" type="image/svg+xml" href="assets/logo.svg">

  <!-- Design System CSS (Material Design 3 & Android 390x844 px) -->
  <link rel="stylesheet" href="css/theme.css?v=1.2.0">
  <link rel="stylesheet" href="css/layout.css?v=1.2.0">
  <link rel="stylesheet" href="css/components.css?v=1.2.0">
  <link rel="stylesheet" href="css/screens.css?v=1.2.0">
</head>
<body>

  <!-- Desktop Preview Host Wrapper -->
  <div class="desktop-preview-host">
    
    <!-- Top Interactive Helper & Role Switcher Bar -->
    <div class="demo-role-bar">
      <div class="brand-badge">
        <span class="material-symbols-rounded" style="color:var(--color-primary); font-size:20px;">spa</span>
        <span>Maneyinda Marukatte</span>
      </div>

      <div class="role-pills">
        <button id="pill-role-customer" class="role-pill-btn active" onclick="AppRouter.switchDemoRole('customer')">
          <span class="material-symbols-rounded" style="font-size:16px;">shopping_basket</span>
          Customer
        </button>
        <button id="pill-role-entrepreneur" class="role-pill-btn" onclick="AppRouter.switchDemoRole('entrepreneur')">
          <span class="material-symbols-rounded" style="font-size:16px;">storefront</span>
          Entrepreneur
        </button>
      </div>

      <div class="demo-tools">
        <button id="lang-toggle-btn" class="tool-icon-btn" onclick="AppLang.toggleLang()" title="Switch Language (English / ಕನ್ನಡ)">
          🌐 English (EN)
        </button>
        <div id="api-status-badge" class="api-status-pill offline" title="Click to test Backend Connection" onclick="window.apiClient && window.apiClient.checkHealth()">
          ⚡ Local Mode
        </div>
        <button class="tool-icon-btn" onclick="AppRouter.toggleViewportMode()" title="Toggle Viewport Frame">
          <span class="material-symbols-rounded" style="font-size:15px;">devices</span>
          Viewport
        </button>
        <button class="tool-icon-btn" onclick="store.resetToSeed()" title="Reset to Initial Demo State">
          <span class="material-symbols-rounded" style="font-size:15px;">restart_alt</span>
          Reset Demo
        </button>
      </div>
    </div>

    <!-- Culturally Welcoming Namaste Desktop Sidebar -->
    <aside id="namaste-desktop-sidebar" class="namaste-desktop-sidebar" aria-label="Welcome greeting">
      <button class="namaste-dismiss-btn" onclick="CustomerModule.dismissNamaste(true)" title="Dismiss greeting">
        <span class="material-symbols-rounded" style="font-size:16px;">close</span>
      </button>
      <div style="font-size:32px; margin-bottom:8px; text-align:center;">🙏</div>
      <h3 style="font-size:14px; font-weight:700; color:var(--color-primary-dark); text-align:center; margin-bottom:6px; line-height:1.3;">
        Namaste! Welcome to Maneyindha Marukatte
      </h3>
      <p style="font-size:11.5px; color:var(--color-text-secondary); text-align:center; line-height:1.45; margin-bottom:12px;">
        Discover homemade delights and handmade treasures from women entrepreneurs near you.
      </p>
      <button class="namaste-cta-btn" style="width:100%; justify-content:center;" onclick="CustomerModule.exploreLocalShops()">
        <span>Explore Local Shops</span>
        <span class="material-symbols-rounded" style="font-size:14px;">arrow_forward</span>
      </button>
    </aside>

    <!-- Android 390 x 844 Mobile Device Shell -->
    <div id="device-shell" class="mobile-device-shell">
      
      <!-- Android Status Bar -->
      <div class="android-status-bar">
        <div id="status-bar-clock">12:45</div>
        <div class="status-bar-notch">
          <div class="notch-speaker"></div>
          <div class="notch-camera"></div>
        </div>
        <div class="status-bar-icons">
          <span class="material-symbols-rounded" style="font-size:16px;">signal_cellular_alt</span>
          <span class="material-symbols-rounded" style="font-size:16px;">wifi</span>
          <span class="material-symbols-rounded" style="font-size:18px;">battery_5_bar</span>
        </div>
      </div>

      <!-- App Screen Viewport -->
      <div id="app-viewport" class="app-screen-container">
        <!-- Rendered dynamically by AppRouter -->
      </div>

      <!-- Android Home Navigation Pill Indicator -->
      <div class="android-home-pill"></div>

      <!-- Global Reusable Bottom Sheet Modal -->
      <div id="global-bottom-sheet" class="bottom-sheet-overlay">
        <div class="bottom-sheet-card">
          <div class="sheet-drag-handle"></div>
          <div id="bottom-sheet-content"></div>
        </div>
      </div>

      <!-- Global Notification / Toast Snackbar -->
      <div id="global-snackbar" class="app-snackbar">
        <span id="snackbar-text">Notification message</span>
      </div>

    </div>
  </div>

  <!-- Razorpay Official Checkout Gateway SDK -->
  <script src="https://checkout.razorpay.com/v1/checkout.js"></script>

  <!-- Application Logic Modules -->
  <script src="assets/illustrations.js?v=1.2.0"></script>
  <script src="js/store.js?v=1.2.0"></script>
  <script src="js/lang.js?v=1.2.0"></script>
  <script src="js/api-client.js?v=1.2.0"></script>
  <script src="js/ai.js?v=1.2.0"></script>
  <script src="js/auth.js?v=1.2.0"></script>
  <script src="js/entrepreneur-reg.js?v=1.2.0"></script>
  <script src="js/entrepreneur.js?v=1.2.0"></script>
  <script src="js/customer.js?v=1.2.0"></script>
  <script src="js/admin.js?v=1.2.0"></script>
  <script src="js/app.js?v=1.2.0"></script>
</body>
</html>
